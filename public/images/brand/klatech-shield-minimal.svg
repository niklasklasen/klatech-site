<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-label="klatech">
  <!-- shield -->
  <path d="M100,232 28,168 28,25Q28,14 39,14L161,14Q172,14 172,25L172,168Z"
        fill="#14171b" stroke="#9a9d81" stroke-width="4" stroke-linejoin="round"/>

  <!-- banner -->
  <rect x="52" y="30" width="96" height="24" rx="2" fill="#252b1e"/>
  <text x="100" y="47" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="15" font-weight="700" letter-spacing="3" fill="#f2f2ea">KLATECH</text>

  <!-- cloud -->
  <g fill="#cdd0bd">
    <circle cx="72" cy="92" r="15"/>
    <circle cx="90" cy="82" r="19"/>
    <circle cx="110" cy="82" r="19"/>
    <circle cx="128" cy="92" r="15"/>
    <rect x="65" y="88" width="70" height="18" rx="9"/>
  </g>

  <!-- connectors -->
  <g stroke="#6b7a3f" stroke-width="2.5" stroke-linecap="round">
    <line x1="82" y1="106" x2="100" y2="138"/>
    <line x1="100" y1="106" x2="100" y2="138"/>
    <line x1="118" y1="106" x2="100" y2="138"/>
  </g>

  <!-- wall (behind the hex node) -->
  <g fill="#9a9d81">
    <rect x="48" y="168" width="104" height="18" rx="1"/>
    <rect x="50" y="157" width="14" height="11"/>
    <rect x="71" y="157" width="14" height="11"/>
    <rect x="115" y="157" width="14" height="11"/>
    <rect x="136" y="157" width="14" height="11"/>
  </g>

  <!-- hex node -->
  <path d="M100,136 127.7,152 127.7,184 100,200 72.3,184 72.3,152Z"
        fill="#14171b" stroke="#9a9d81" stroke-width="3" stroke-linejoin="round"/>
  <path d="M100,150 112,172 88,172Z" fill="none" stroke="#6b7a3f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="100" cy="165" r="6" fill="#f2f2ea"/>
</svg>
